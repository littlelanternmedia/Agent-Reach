name: Potato Agent Reach Smoke

on:
  push:
    paths:
      - .github/workflows/potato-agent-reach-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Potato fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install fork only
        run: python -m pip install .

      - name: Arm Potato Social Read-Only Gate
        run: |
          python -m agent_reach.social_guard_cli install
          echo "$HOME/.agent-reach/readonly-bin" >> "$GITHUB_PATH"
          python -m agent_reach.social_guard_cli check -- twitter search "agent reach"
          set +e
          python -m agent_reach.social_guard_cli check -- twitter post "THIS MUST NEVER SEND"
          rc=$?
          set -e
          test "$rc" -eq 126
          echo "WRITE-BLOCK: PASS (twitter post rejected with exit 126)"

      - name: Agent Reach doctor
        run: |
          agent-reach doctor --json | tee /tmp/doctor.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/doctor.json', encoding='utf-8'))
          print('DOCTOR-CHANNELS:', ', '.join(sorted(data)))
          for key in ('web','rss','youtube','bilibili','v2ex'):
              row=data.get(key,{})
              print(f"DOCTOR-{key.upper()}: status={row.get('status')} backend={row.get('active_backend')}")
          print('DOCTOR: PASS')
          PY

      - name: Real web read via Jina Reader
        id: jina
        continue-on-error: true
        run: |
          curl -sS -L --max-time 30 -w '%{http_code}\n' "https://r.jina.ai/https://github.com/Panniantong/Agent-Reach" -o /tmp/jina.txt | tee /tmp/jina.status
          test "$(cat /tmp/jina.status)" = "200"
          test -s /tmp/jina.txt
          grep -qi "Agent Reach" /tmp/jina.txt
          echo "JINA-WEB: PASS"
          head -n 10 /tmp/jina.txt

      - name: Real GitHub search via gh
        id: github_search
        continue-on-error: true
        run: |
          gh search repos "agent reach" --sort stars --limit 3 --json fullName,description,url > /tmp/gh.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/gh.json', encoding='utf-8'))
          assert rows, 'GitHub search returned no repositories'
          print('GITHUB-SEARCH: PASS')
          for row in rows:
              print('-', row['fullName'], row['url'])
          PY

      - name: Real RSS fetch
        id: rss
        continue-on-error: true
        run: |
          python - <<'PY'
          import feedparser
          feed=feedparser.parse('https://hnrss.org/frontpage')
          assert feed.entries, f'RSS returned no entries; bozo={getattr(feed, "bozo", None)}'
          print('RSS: PASS')
          for item in feed.entries[:3]:
              print('-', item.get('title','(untitled)'))
          PY

      - name: Real V2EX public API
        id: v2ex
        continue-on-error: true
        run: |
          curl -fsSL --max-time 30 "https://www.v2ex.com/api/topics/hot.json" -H "User-Agent: agent-reach/1.0" -o /tmp/v2ex.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/v2ex.json', encoding='utf-8'))
          assert rows, 'V2EX returned no hot topics'
          print('V2EX: PASS')
          for row in rows[:3]:
              print('-', row.get('title'))
          PY

      - name: Real YouTube search via yt-dlp
        id: youtube
        continue-on-error: true
        run: |
          yt-dlp --flat-playlist --dump-single-json "ytsearch1:OpenAI" > /tmp/youtube.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/youtube.json', encoding='utf-8'))
          entries=data.get('entries') or []
          assert entries, 'YouTube search returned no entries'
          item=entries[0]
          print('YOUTUBE-SEARCH: PASS')
          print('-', item.get('title'), item.get('url') or item.get('id'))
          PY

      - name: Smoke summary
        if: always()
        run: |
          echo "## Potato Agent Reach — credential-free smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Social write-block gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Jina web read: ${{ steps.jina.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub search: ${{ steps.github_search.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- RSS fetch: ${{ steps.rss.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- V2EX public API: ${{ steps.v2ex.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- YouTube search: ${{ steps.youtube.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No social credentials, browser cookies, OAuth tokens, or user secrets were supplied." >> "$GITHUB_STEP_SUMMARY"
